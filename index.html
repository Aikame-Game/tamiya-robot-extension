<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タミヤロボット コントローラー & Scratch</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1a1a24;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.5rem;
            color: #4c97ff;
            margin-bottom: 6px;
        }

        /* 接続ステータスバー */
        .status-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #2a2a38;
            padding: 10px 20px;
            border-radius: 30px;
            width: 100%;
            max-width: 420px;
            margin-bottom: 15px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ff4c4c;
        }

        .dot.connected {
            background-color: #4caf50;
            box-shadow: 0 0 10px #4caf50;
        }

        .btn-connect {
            background-color: #008cba;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-connect:hover {
            background-color: #005f7f;
        }

        /* Mode Jump Button */
        .nav-scratch {
            width: 100%;
            max-width: 420px;
            margin-bottom: 20px;
        }

        .btn-scratch {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffab19, #ff8c00);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.4);
            text-decoration: none;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .btn-scratch:active {
            transform: scale(0.98);
        }

        /* D-PAD (5x5 GRID for 2-step arrows) */
        .controller-panel {
            background: #2a2a38;
            padding: 20px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .dpad-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 8px;
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 360px;
        }

        .btn-cmd {
            background: #3a3a4c;
            border: 2px solid #4a4a5e;
            border-radius: 14px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.1s, transform 0.05s;
            touch-action: manipulation;
        }

        .btn-cmd:active, .btn-cmd.active {
            background: #4c97ff;
            border-color: #79b1ff;
            transform: scale(0.95);
        }

        /* 2段階（Fast）ボタンの強調表示 */
        .btn-cmd.fast {
            background: #2b4263;
            border-color: #3b629b;
            color: #ffca28;
        }

        .btn-cmd.fast:active, .btn-cmd.fast.active {
            background: #ffab19;
            border-color: #ffd54f;
            color: #fff;
        }

        .btn-stop {
            background: #d32f2f;
            border-color: #f44336;
            font-size: 1rem;
            font-weight: bold;
            grid-column: 3;
            grid-row: 3;
        }

        .btn-stop:active {
            background: #b71c1c;
        }

        /* Sub controls */
        .sub-controls {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn-sub {
            flex: 1;
            padding: 12px;
            background: #3a3a4c;
            border: 1px solid #5a5a6e;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        /* Alert Display */
        .alert-banner {
            width: 100%;
            max-width: 420px;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .alert-wall {
            background: #ff9800;
            color: #000;
            display: block;
        }

        .alert-flip {
            background: #f44336;
            color: #fff;
            display: block;
        }

        .guide-text {
            font-size: 0.8rem;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>🤖 タミヤ コントローラー</h1>
        <p style="font-size: 0.85rem; color: #aaa;">micro:bit WebUSB Control</p>
    </header>

    <!-- 接続状態 -->
    <div class="status-container">
        <div class="status-indicator">
            <div id="dot" class="dot"></div>
            <span id="status-text">未接続</span>
        </div>
        <button id="btn-connect" class="btn-connect">USB接続</button>
    </div>

    <!-- Scratch画面へのジャンプボタン -->
    <div class="nav-scratch">
        <button id="btn-scratch" class="btn-scratch">
            <span>🧩 Scratchでプログラミングする</span>
        </button>
    </div>

    <!-- コントローラーパネル (5x5 GRID) -->
    <div class="controller-panel">
        <p class="guide-text">外側：2速（速い） / 内側：1速（普通）<br>※押している間だけ進みます</p>
        <div class="dpad-container">
            <!-- Row 1 -->
            <div></div>
            <div></div>
            <button class="btn-cmd fast" data-cmd="F2" style="grid-column: 3; grid-row: 1;">▲▲<span style="font-size:0.6rem">高速</span></button>
            <div></div>
            <div></div>

            <!-- Row 2 -->
            <div></div>
            <div></div>
            <button class="btn-cmd" data-cmd="F" style="grid-column: 3; grid-row: 2;">▲</button>
            <div></div>
            <div></div>

            <!-- Row 3 -->
            <div></div>
            <button class="btn-cmd" data-cmd="L" style="grid-column: 2; grid-row: 3;">◀</button>
            <button class="btn-cmd btn-stop" id="btn-s">STOP</button>
            <button class="btn-cmd" data-cmd="R" style="grid-column: 4; grid-row: 3;">▶</button>
            <div></div>

            <!-- Row 4 -->
            <div></div>
            <div></div>
            <button class="btn-cmd" data-cmd="B" style="grid-column: 3; grid-row: 4;">▼</button>
            <div></div>
            <div></div>

            <!-- Row 5 -->
            <div></div>
            <div></div>
            <button class="btn-cmd fast" data-cmd="B2" style="grid-column: 3; grid-row: 5;">▼▼<span style="font-size:0.6rem">高速</span></button>
            <div></div>
            <div></div>
        </div>

        <div class="sub-controls">
            <button id="btn-horn" class="btn-sub">🎺 クラクション</button>
        </div>
    </div>

    <!-- アラート通知表示領域 -->
    <div id="alert-box" class="alert-banner"></div>

    <script>
        // === Scratch URL ===
        const EXTENSION_URL = "https://Aikame-Game.github.io/tamiya-robot-extension/tamiya_robot_extension.js";
        const TURBOWARP_URL = `https://turbowarp.org/editor?extension=${encodeURIComponent(EXTENSION_URL)}`;

        document.getElementById('btn-scratch').addEventListener('click', () => {
            window.location.href = TURBOWARP_URL;
        });

        // === WebUSB 通信 ===
        let port = null;
        let writer = null;
        let reader = null;

        const btnConnect = document.getElementById('btn-connect');
        const dot = document.getElementById('dot');
        const statusText = document.getElementById('status-text');
        const alertBox = document.getElementById('alert-box');

        btnConnect.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                const textEncoder = new TextEncoderStream();
                textEncoder.readable.pipeTo(port.writable);
                writer = textEncoder.writable.getWriter();

                dot.classList.add('connected');
                statusText.textContent = "接続済み";
                btnConnect.style.display = "none";

                startReading();
            } catch (e) {
                alert("接続エラー: " + e);
            }
        });

        async function send(cmd) {
            if (writer) {
                await writer.write(cmd + "\n");
            }
        }

        async function startReading() {
            const textDecoder = new TextDecoderStream();
            port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();

            let buffer = "";
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value) {
                        buffer += value;
                        if (buffer.includes("WALL")) {
                            showAlert("⚠️ 障害物が近くにあります！", "alert-wall");
                            buffer = "";
                        } else if (buffer.includes("FLIP")) {
                            showAlert("💀 ロボットが転倒しました！", "alert-flip");
                            buffer = "";
                        }
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        function showAlert(msg, className) {
            alertBox.textContent = msg;
            alertBox.className = `alert-banner ${className}`;
            setTimeout(() => {
                alertBox.className = "alert-banner";
            }, 2000);
        }

        // --- 操作性の改善：ホールド操作（押したら移動・離したら停止） ---
        const cmdButtons = document.querySelectorAll('.btn-cmd[data-cmd]');
        let activeCommand = null;

        cmdButtons.forEach(btn => {
            const cmd = btn.getAttribute('data-cmd');

            // 押した時 (マウス & タッチ)
            const handleStart = (e) => {
                e.preventDefault();
                activeCommand = cmd;
                btn.classList.add('active');
                send(cmd);
            };

            // 離した時
            const handleEnd = (e) => {
                e.preventDefault();
                if (activeCommand) {
                    activeCommand = null;
                    btn.classList.remove('active');
                    send('S'); // 離したら安全のためSTOP送信
                }
            };

            btn.addEventListener('mousedown', handleStart);
            btn.addEventListener('mouseup', handleEnd);
            btn.addEventListener('mouseleave', handleEnd);

            btn.addEventListener('touchstart', handleStart);
            btn.addEventListener('touchend', handleEnd);
            btn.addEventListener('touchcancel', handleEnd);
        });

        // STOP & クラクション
        document.getElementById('btn-s').addEventListener('click', () => send('S'));
        document.getElementById('btn-horn').addEventListener('click', () => send('H'));
    </script>
</body>
</html>
