<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タミヤロボット コントローラー & Scratch</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1a1a24;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            color: #4c97ff;
            margin-bottom: 8px;
        }

        /* 接続ステータスバー */
        .status-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #2a2a38;
            padding: 10px 20px;
            border-radius: 30px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ff4c4c;
        }

        .dot.connected {
            background-color: #4caf50;
            box-shadow: 0 0 10px #4caf50;
        }

        .btn-connect {
            background-color: #008cba;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-connect:hover {
            background-color: #005f7f;
        }

        /* モード切替（Scratchジャンプボタン） */
        .nav-scratch {
            width: 100%;
            max-width: 400px;
            margin-bottom: 25px;
        }

        .btn-scratch {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffab19, #ff8c00);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.4);
            text-decoration: none;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .btn-scratch:active {
            transform: scale(0.98);
        }

        /* D-PAD（コントローラー部分） */
        .controller-panel {
            background: #2a2a38;
            padding: 25px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            grid-template-rows: repeat(3, 80px);
            gap: 10px;
        }

        .btn-cmd {
            background: #3a3a4c;
            border: 2px solid #4a4a5e;
            border-radius: 16px;
            color: white;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.1s;
            touch-action: manipulation;
        }

        .btn-cmd:active, .btn-cmd.active {
            background: #4c97ff;
            border-color: #79b1ff;
        }

        .btn-stop {
            background: #d32f2f;
            border-color: #f44336;
            font-size: 1rem;
            font-weight: bold;
        }

        .btn-stop:active {
            background: #b71c1c;
        }

        /* サブコントロール（ギア・ホーン） */
        .sub-controls {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        .btn-sub {
            flex: 1;
            padding: 12px;
            background: #3a3a4c;
            border: 1px solid #5a5a6e;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-sub.gear-active {
            background: #4caf50;
            border-color: #81c784;
        }

        /* アラート通知表示 */
        .alert-banner {
            width: 100%;
            max-width: 400px;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .alert-wall {
            background: #ff9800;
            color: #000;
            display: block;
        }

        .alert-flip {
            background: #f44336;
            color: #fff;
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <h1>🤖 タミヤ コントローラー</h1>
        <p style="font-size: 0.85rem; color: #aaa;">micro:bit WebUSB Control</p>
    </header>

    <!-- 接続状態 -->
    <div class="status-container">
        <div class="status-indicator">
            <div id="dot" class="dot"></div>
            <span id="status-text">未接続</span>
        </div>
        <button id="btn-connect" class="btn-connect">USB接続</button>
    </div>

    <!-- Scratch画面へのジャンプボタン -->
    <div class="nav-scratch">
        <button id="btn-scratch" class="btn-scratch">
            <span>🧩 Scratchでプログラミングする</span>
        </button>
    </div>

    <!-- コントローラーパネル -->
    <div class="controller-panel">
        <div class="dpad">
            <div></div>
            <button class="btn-cmd" id="btn-f">▲</button>
            <div></div>
            <button class="btn-cmd" id="btn-l">◀</button>
            <button class="btn-cmd btn-stop" id="btn-s">STOP</button>
            <button class="btn-cmd" id="btn-r">▶</button>
            <div></div>
            <button class="btn-cmd" id="btn-b">▼</button>
            <div></div>
        </div>

        <div class="sub-controls">
            <button id="btn-gear" class="btn-sub">⚙️ GEAR: 1</button>
            <button id="btn-horn" class="btn-sub">🎺 クラクション</button>
        </div>
    </div>

    <!-- アラート通知表示領域 -->
    <div id="alert-box" class="alert-banner"></div>

    <script>
        // === 設定 ===
        const EXTENSION_URL = "https://Aikame-Game.github.io/tamiya-robot-extension/tamiya_robot_extension.js";
        const TURBOWARP_URL = `https://turbowarp.org/editor?extension=${encodeURIComponent(EXTENSION_URL)}`;

        // Scratchへ飛ぶ
        document.getElementById('btn-scratch').addEventListener('click', () => {
            window.location.href = TURBOWARP_URL;
        });

        // === WebUSB 通信ロジック ===
        let port = null;
        let writer = null;
        let reader = null;
        let isGear2 = false;

        const btnConnect = document.getElementById('btn-connect');
        const dot = document.getElementById('dot');
        const statusText = document.getElementById('status-text');
        const alertBox = document.getElementById('alert-box');

        // USB接続処理
        btnConnect.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                
                const textEncoder = new TextEncoderStream();
                textEncoder.readable.pipeTo(port.writable);
                writer = textEncoder.writable.getWriter();

                dot.classList.add('connected');
                statusText.textContent = "接続済み";
                btnConnect.style.display = "none";

                startReading();
            } catch (e) {
                alert("接続に失敗しました: " + e);
            }
        });

        // シリアルデータ送信
        async function send(cmd) {
            if (writer) {
                await writer.write(cmd + "\n");
            }
        }

        // シリアル受信（WALL / FLIP 警報受信）
        async function startReading() {
            const textDecoder = new TextDecoderStream();
            port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();

            let buffer = "";
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value) {
                        buffer += value;
                        if (buffer.includes("WALL")) {
                            showAlert("⚠️ 障害物が近くにあります！", "alert-wall");
                            buffer = "";
                        } else if (buffer.includes("FLIP")) {
                            showAlert("💀 ロボットが転倒しました！", "alert-flip");
                            buffer = "";
                        }
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        function showAlert(msg, className) {
            alertBox.textContent = msg;
            alertBox.className = `alert-banner ${className}`;
            setTimeout(() => {
                alertBox.className = "alert-banner";
            }, 2000);
        }

        // --- コントローラーボタンイベント ---
        const btnF = document.getElementById('btn-f');
        const btnB = document.getElementById('btn-b');
        const btnL = document.getElementById('btn-l');
        const btnR = document.getElementById('btn-r');
        const btnS = document.getElementById('btn-s');
        const btnGear = document.getElementById('btn-gear');
        const btnHorn = document.getElementById('btn-horn');

        btnF.addEventListener('click', () => send(isGear2 ? 'F2' : 'F'));
        btnB.addEventListener('click', () => send(isGear2 ? 'B2' : 'B'));
        btnL.addEventListener('click', () => send('L'));
        btnR.addEventListener('click', () => send('R'));
        btnS.addEventListener('click', () => send('S'));
        btnHorn.addEventListener('click', () => send('H'));

        btnGear.addEventListener('click', () => {
            isGear2 = !isGear2;
            btnGear.textContent = isGear2 ? "⚙️ GEAR: 2 (FAST)" : "⚙️ GEAR: 1";
            btnGear.classList.toggle('gear-active', isGear2);
        });
    </script>
</body>
</html>
